name: Bootstrap kkudok from team RE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  mirror:
    if: github.repository == 'syemk999-collab/kkudok'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror team repository history into kkudok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror https://github.com/bangsuhyoek/RE.git source.git
          cd source.git
          git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin 'refs/heads/*:refs/heads/*'
          git push --force origin 'refs/tags/*:refs/tags/*'
