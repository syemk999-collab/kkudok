name: Bootstrap kkudok from team RE

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-from-team.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'syemk999-collab/kkudok'
    runs-on: ubuntu-latest
    steps:
      - name: Import team main snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch main https://github.com/bangsuhyoek/RE.git /tmp/source
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/dest
          cd /tmp/dest
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "chore: import bangsuhyoek/RE main baseline"
          git push origin main
