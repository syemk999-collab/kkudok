name: Cleanup bootstrap branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-bootstrap-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches created by failed mirror bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init /tmp/repo
          cd /tmp/repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for branch in             chore/local-ocr-setup             feat/android-mobile-final-ui-20260906             feat/refresh-theme             feature/receipt-recognition             fix/local-receipt-ocr             fix/re-web-function-compatibility-20260906             re-compatibility-upgrade-v2             re-figma-complete-ui-20260905             re-rollback-ui-rive-redesign-20260905             re-uxui-cleanup             re-web-dreamscape-integration-20260906             re-web-dreamscape-redesign-20260906             re-web-dreamy-final-20260906             re-web-dreamy-redesign-20260906
          do
            git push origin --delete "$branch" || true
          done
