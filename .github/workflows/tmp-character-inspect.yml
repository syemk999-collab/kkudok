name: Temporary character inspect

on:
  push:
    branches:
      - feature/contest-experience-v2
    paths:
      - .github/workflows/tmp-character-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: kkudok-character-inspect
          path: public/assets/kkudok/character.png
          if-no-files-found: error
